function SettingsScreen({ state, dispatch, onClose }) {
  const [showAddForm, setShowAddForm] = React.useState(false);
  const [newName, setNewName]         = React.useState('');
  const [newGL, setNewGL]             = React.useState('');
  const [newAqueous, setNewAqueous]   = React.useState(true);

  const handleExport = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `bubble-lab-export-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  const handleReset = () => {
    if (window.confirm('Reset everything? All recipes, batches, and sessions will be deleted.')) {
      dispatch({ type: 'RESET' });
      onClose();
    }
  };

  const handleAddConcentrate = () => {
    const gL = parseFloat(newGL);
    if (!newName.trim() || !gL || gL <= 0) return;
    dispatch({
      type: 'ADD_CONCENTRATE',
      concentrate: { id: uuid(), name: newName.trim(), gPerML: gL / 1000, aqueous: newAqueous }
    });
    setNewName(''); setNewGL(''); setNewAqueous(true); setShowAddForm(false);
  };

  const handleDelete = (c) => {
    if (window.confirm(`Remove "${c.name}" stock solution?`)) {
      dispatch({ type: 'DELETE_CONCENTRATE', id: c.id });
    }
  };

  return (
    <div className="flex flex-col h-full">
      <Header left={<button onClick={onClose} className="tap px-2 -ml-2 text-base">‹ Back</button>} title="Settings" />
      <div className="flex-1 overflow-y-auto">
        {/* Export data section */}
        <div className="px-4 py-5 border-t border-gray-200">
          <div className="text-sm font-semibold text-gray-900 mb-1">Export Data</div>
          <div className="text-sm text-gray-500 mb-3">Download a JSON backup of all your recipes, batches, and sessions.</div>
          <SecondaryBtn onClick={handleExport}>Export JSON</SecondaryBtn>
        </div>

        {/* Stock solutions section */}
        <div className="border-t border-gray-200 px-4 py-5">
          <div className="text-sm font-semibold text-gray-900 mb-1">Stock solutions</div>
          <div className="text-sm text-gray-500 mb-3">Concentrates used in your recipes. Volumes are shown in the ingredient checklist.</div>

          {/* Existing concentrates list */}
          {(state.concentrates || []).map(c => {
            const gL = c.gPerML * 1000;
            const gLStr = gL.toFixed(gL >= 1 ? 1 : 2) + ' g/L';
            return (
              <div key={c.id} className="flex items-center justify-between py-2 border-b border-gray-100">
                <div>
                  <span className="text-sm font-medium">{c.name}</span>
                  <span className="text-xs text-gray-500 ml-2">{gLStr}</span>
                  <span className="ml-2 text-xs bg-gray-100 px-1.5 py-0.5 rounded">{c.aqueous ? 'aqueous' : 'alcohol'}</span>
                </div>
                <button onClick={() => handleDelete(c)} className="text-gray-400 text-lg leading-none tap">✕</button>
              </div>
            );
          })}

          {/* Add new concentrate form */}
          {showAddForm ? (
            <div className="mt-3">
              <input
                type="text"
                value={newName}
                onChange={e => setNewName(e.target.value)}
                placeholder="e.g. HEC"
                className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-2"
              />
              <input
                type="number"
                value={newGL}
                onChange={e => setNewGL(e.target.value)}
                placeholder="g/L"
                step="0.001"
                className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-2"
              />
              <div className="flex gap-2 mb-2">
                <button
                  onClick={() => setNewAqueous(true)}
                  className={classNames(
                    'flex-1 rounded-lg px-3 py-2 text-sm font-medium',
                    newAqueous ? 'bg-black text-white' : 'bg-gray-100 text-gray-600'
                  )}>
                  Water-based
                </button>
                <button
                  onClick={() => setNewAqueous(false)}
                  className={classNames(
                    'flex-1 rounded-lg px-3 py-2 text-sm font-medium',
                    !newAqueous ? 'bg-black text-white' : 'bg-gray-100 text-gray-600'
                  )}>
                  Alcohol-based
                </button>
              </div>
              <div className="flex gap-2">
                <button onClick={() => { setShowAddForm(false); setNewName(''); setNewGL(''); setNewAqueous(true); }}
                  className="tap flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm text-gray-600">
                  Cancel
                </button>
                <button onClick={handleAddConcentrate}
                  disabled={!newName.trim() || !newGL || parseFloat(newGL) <= 0}
                  className="tap flex-1 bg-black text-white rounded-lg px-3 py-2 text-sm font-medium disabled:opacity-40">
                  Add
                </button>
              </div>
            </div>
          ) : (
            <button onClick={() => setShowAddForm(true)} className="text-sm text-black font-medium underline tap mt-3">
              ＋ Add stock solution
            </button>
          )}
        </div>

        {/* Reset to defaults section */}
        <div className="px-4 py-5 border-t border-gray-200">
          <div className="text-sm font-semibold text-gray-900 mb-1">Reset to Defaults</div>
          <div className="text-sm text-gray-500 mb-3">Clear all data and restore example recipes. This cannot be undone.</div>
          <button onClick={handleReset}
            className="tap w-full border-2 border-red-500 text-red-500 font-semibold py-3 rounded-xl bg-white active:bg-red-50">
            Reset
          </button>
        </div>
      </div>
    </div>
  );
}

const STATUS_STYLE = {
  aging:  'bg-yellow-100 text-yellow-800 border-yellow-300',
  ready:  'bg-green-100  text-green-800  border-green-300',
  tested: 'bg-gray-100   text-gray-500   border-gray-200',
};

function StatusBadge({ status, onClick }) {
  return (
    <button onClick={onClick} disabled={!onClick}
      className={classNames(
        'rounded-full border px-2 py-0.5 text-xs font-semibold capitalize',
        STATUS_STYLE[status] || STATUS_STYLE.aging,
        onClick ? 'active:opacity-70' : 'cursor-default'
      )}>
      {status}
    </button>
  );
}

function FieldTab({ state, dispatch }) {
  const [fieldView, setFieldView] = useState({ kind: 'home' });
  const activeSession = state.sessions.find(s => s.ended_at === null);
  const recipes = state.recipes;

  // guard: if viewing session/rating but no active session exists, go home
  React.useEffect(() => {
    if ((fieldView.kind === 'session' || fieldView.kind === 'rating') && !activeSession) {
      setFieldView({ kind: 'home' });
    }
  }, [activeSession]);

  if (fieldView.kind === 'start-session') {
    return <StartSessionSheet
      batches={state.batches}
      recipes={recipes}
      onCancel={() => setFieldView({ kind: 'home' })}
      onCreate={(session) => {
        dispatch({ type: 'ADD_SESSION', session });
        setFieldView({ kind: 'session' });
      }}
    />;
  }

  if (fieldView.kind === 'session') {
    return <ActiveSessionScreen
      session={activeSession}
      batches={state.batches}
      recipes={recipes}
      onRate={(batchId) => setFieldView({ kind: 'rating', batchId })}
      onEnd={() => {
        dispatch({ type: 'UPDATE_SESSION', session: { ...activeSession, ended_at: new Date().toISOString() } });
        setFieldView({ kind: 'home' });
      }}
    />;
  }

  if (fieldView.kind === 'rating') {
    const existing = activeSession?.batch_ratings?.find(r => r.batch_id === fieldView.batchId);
    return <BatchRatingScreen
      batchId={fieldView.batchId}
      batches={state.batches}
      recipes={recipes}
      initialRating={existing}
      onDone={(batchRating) => {
        const updatedRatings = existing
          ? activeSession.batch_ratings.map(r => r.batch_id === fieldView.batchId ? batchRating : r)
          : [...(activeSession.batch_ratings || []), batchRating];
        dispatch({ type: 'UPDATE_SESSION', session: { ...activeSession, batch_ratings: updatedRatings } });
        const batch = state.batches.find(b => b.id === fieldView.batchId);
        if (batch && batch.status !== 'tested' && ratingCount(batchRating) > 0) {
          dispatch({ type: 'UPDATE_BATCH', batch: { ...batch, status: 'tested' } });
        }
        setFieldView({ kind: 'session' });
      }}
      onBack={() => setFieldView({ kind: 'session' })}
    />;
  }

  // home view
  const toggleStatus = (batch) => {
    const next = batch.status === 'aging' ? 'ready' : 'aging';
    dispatch({ type: 'UPDATE_BATCH', batch: { ...batch, status: next } });
  };

  const sorted = [...state.batches].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  return (
    <div className="flex flex-col h-full">
      <Header title="Field" />
      <div className="flex-1 overflow-y-auto">
        <div className="px-4 pt-4">
          {activeSession ? (
            <div className="rounded-xl border-2 border-black p-4 mb-4">
              <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-1">Active session</div>
              <div className="font-semibold capitalize">
                {activeSession.conditions.weather} · {activeSession.conditions.wind} wind
              </div>
              <div className="text-sm text-gray-500 mt-0.5">
                {activeSession.batch_ratings?.length || 0} / {activeSession.batch_ids?.length || 0} batches rated
              </div>
              <div className="mt-3">
                <PrimaryBtn onClick={() => setFieldView({ kind: 'session' })}>Resume session</PrimaryBtn>
              </div>
            </div>
          ) : (
            <>
              <PrimaryBtn
                onClick={() => setFieldView({ kind: 'start-session' })}
                disabled={state.batches.length === 0}>
                + Start session
              </PrimaryBtn>
              {state.batches.length === 0 && (
                <div className="text-sm text-gray-500 text-center mt-2">Make a batch from a recipe first.</div>
              )}
            </>
          )}
        </div>

        <div className="px-4 pt-5">
          <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-2">
            Batches ({sorted.length})
          </div>
          {sorted.length === 0 ? (
            <div className="text-sm text-gray-400 py-4 text-center">No batches yet.</div>
          ) : (
            <ul>
              {sorted.map(b => {
                const recipe = recipes.find(r => r.id === b.recipe_id);
                return (
                  <li key={b.id} className="flex items-center gap-3 py-3 border-b border-gray-100">
                    <div className="flex-1 min-w-0">
                      <div className="font-semibold text-base">
                        #{b.number} · {recipe ? autoName(recipe) : 'Unknown recipe'}
                      </div>
                      <div className="text-sm text-gray-500">{b.volume_L}L · {fmtAge(b.created_at)} old</div>
                      {b.notes ? <div className="text-xs text-gray-400 mt-0.5 truncate">{b.notes}</div> : null}
                    </div>
                    <StatusBadge
                      status={b.status}
                      onClick={b.status !== 'tested' ? () => toggleStatus(b) : null}
                    />
                  </li>
                );
              })}
            </ul>
          )}
        </div>
      </div>
    </div>
  );
}

function StartSessionSheet({ batches, recipes, onCancel, onCreate }) {
  const [step, setStep] = useState(1);
  const [selectedIds, setSelectedIds] = useState([]);
  const [weather, setWeather] = useState(null);
  const [wind, setWind] = useState(null);

  const toggleBatch = (id) =>
    setSelectedIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);

  const submit = () => {
    onCreate({
      id: uuid(),
      started_at: new Date().toISOString(),
      ended_at: null,
      conditions: { weather, wind },
      batch_ids: selectedIds,
      batch_ratings: [],
    });
  };

  const sorted = [...batches].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  return (
    <div className="flex flex-col h-full">
      <Header
        left={
          <button onClick={step === 1 ? onCancel : () => setStep(1)} className="tap px-2 -ml-2 text-base">
            {step === 1 ? 'Cancel' : '‹ Back'}
          </button>
        }
        title={step === 1 ? 'Pick batches' : 'Conditions'}
        right={
          step === 1
            ? <button onClick={() => setStep(2)} disabled={selectedIds.length === 0}
                className={classNames('tap px-2 -mr-2 text-base font-bold', selectedIds.length === 0 ? 'text-gray-400' : '')}>
                Next
              </button>
            : <button onClick={submit} disabled={!weather || !wind}
                className={classNames('tap px-2 -mr-2 text-base font-bold', (!weather || !wind) ? 'text-gray-400' : '')}>
                Start
              </button>
        }
      />
      <div className="flex-1 overflow-y-auto pb-8">
        {step === 1 && (
          <div className="px-4 pt-4">
            <div className="text-sm text-gray-500 mb-4">Select which batches you're testing today.</div>
            {sorted.length === 0 ? (
              <div className="text-sm text-gray-400 text-center py-8">No batches yet.</div>
            ) : (
              <ul>
                {sorted.map(b => {
                  const recipe = recipes.find(r => r.id === b.recipe_id);
                  const selected = selectedIds.includes(b.id);
                  return (
                    <li key={b.id}>
                      <button onClick={() => toggleBatch(b.id)}
                        className="w-full flex items-center gap-3 py-3 border-b border-gray-100 text-left active:bg-gray-50">
                        <span className={classNames(
                          'w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0 text-base',
                          selected ? 'bg-black border-black text-white' : 'border-gray-400 bg-white'
                        )}>{selected ? '✓' : ''}</span>
                        <span className="flex-1 min-w-0">
                          <span className="font-semibold block">
                            #{b.number} · {recipe ? autoName(recipe) : 'Unknown'}
                          </span>
                          <span className="text-sm text-gray-500">
                            {b.volume_L}L · {fmtAge(b.created_at)} old · {b.status}
                          </span>
                        </span>
                      </button>
                    </li>
                  );
                })}
              </ul>
            )}
          </div>
        )}
        {step === 2 && (
          <div className="px-4 pt-4 space-y-6">
            <div>
              <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-3">Weather</div>
              <div className="grid grid-cols-2 gap-2">
                {['cold', 'mild', 'warm', 'hot'].map(w => (
                  <button key={w} onClick={() => setWeather(w)}
                    className={classNames(
                      'tap rounded-xl border-2 py-3 text-base capitalize font-semibold',
                      weather === w ? 'border-black bg-black text-white' : 'border-gray-300 bg-white active:bg-gray-50'
                    )}>{w}</button>
                ))}
              </div>
            </div>
            <div>
              <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-3">Wind</div>
              <div className="grid grid-cols-2 gap-2">
                {['calm', 'light', 'moderate', 'strong'].map(w => (
                  <button key={w} onClick={() => setWind(w)}
                    className={classNames(
                      'tap rounded-xl border-2 py-3 text-base capitalize font-semibold',
                      wind === w ? 'border-black bg-black text-white' : 'border-gray-300 bg-white active:bg-gray-50'
                    )}>{w}</button>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function ActiveSessionScreen({ session, batches, recipes, onRate, onEnd }) {
  const sessionBatches = (session.batch_ids || [])
    .map(id => batches.find(b => b.id === id))
    .filter(Boolean);

  return (
    <div className="flex flex-col h-full">
      <Header
        title="Active Session"
        right={
          <button
            onClick={() => { if (window.confirm('End this session?')) onEnd(); }}
            className="tap px-2 -mr-2 text-sm text-red-600 font-semibold">
            End
          </button>
        }
      />
      <div className="flex-1 overflow-y-auto">
        <div className="px-4 pt-4 pb-3 border-b border-gray-100">
          <div className="flex gap-2 flex-wrap">
            <span className="rounded-full border border-gray-300 px-3 py-1 text-sm capitalize">
              {session.conditions.weather}
            </span>
            <span className="rounded-full border border-gray-300 px-3 py-1 text-sm capitalize">
              {session.conditions.wind} wind
            </span>
          </div>
          <div className="text-xs text-gray-400 mt-2">
            {new Date(session.started_at).toLocaleString()}
          </div>
        </div>

        <div className="px-4 pt-4">
          <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-2">Batches</div>
          <ul>
            {sessionBatches.map(b => {
              const recipe = recipes.find(r => r.id === b.recipe_id);
              const batchRating = session.batch_ratings?.find(r => r.batch_id === b.id);
              const rated = ratingCount(batchRating);
              return (
                <li key={b.id}>
                  <button onClick={() => onRate(b.id)}
                    className="w-full flex items-center gap-3 py-4 border-b border-gray-100 text-left active:bg-gray-50">
                    <div className="flex-1 min-w-0">
                      <div className="font-semibold text-base">
                        #{b.number} · {recipe ? autoName(recipe) : 'Unknown'}
                      </div>
                      <div className="text-sm text-gray-500">{b.volume_L}L · {fmtAge(b.created_at)} old</div>
                    </div>
                    <div className="text-right shrink-0">
                      <div className="text-sm font-semibold">
                        {rated} / {RATING_PROPERTIES.length}
                      </div>
                      <div className="text-xs text-gray-400">rated ›</div>
                    </div>
                  </button>
                </li>
              );
            })}
          </ul>
        </div>
        <div className="h-8" />
      </div>
    </div>
  );
}

function StarRow({ value, onChange }) {
  return (
    <div className="flex gap-2">
      {[1, 2, 3, 4, 5].map(n => {
        const selected = value === n;
        return (
          <button
            key={n}
            onClick={() => onChange(selected ? null : n)}
            className="flex items-center justify-center rounded-full border-2 border-black text-sm font-bold flex-shrink-0"
            style={{ width: 32, height: 32, background: selected ? '#000' : '#fff', color: selected ? '#fff' : '#000' }}
          >
            {n}
          </button>
        );
      })}
    </div>
  );
}

function BatchRatingScreen({ batchId, batches, recipes, initialRating, onDone, onBack }) {
  const [ratings, setRatings] = React.useState(initialRating?.ratings ?? emptyRatings());
  const [overallNote, setOverallNote] = React.useState(initialRating?.overall_note ?? '');
  // Track which property notes are expanded
  const [expandedNotes, setExpandedNotes] = React.useState(() => {
    const init = {};
    RATING_PROPERTIES.forEach(p => {
      init[p.key] = !!(initialRating?.ratings?.[p.key]?.note);
    });
    return init;
  });

  const batch = batches?.find(b => b.id === batchId);
  const recipe = batch ? recipes?.find(r => r.id === batch.recipe_id) : null;
  const title = batch
    ? `Batch #${batch.number}${recipe ? ' · ' + autoName(recipe) : ''}`
    : 'Rate batch';

  const setStars = (key, stars) => {
    setRatings(prev => ({ ...prev, [key]: { ...prev[key], stars } }));
  };

  const setNote = (key, note) => {
    setRatings(prev => ({ ...prev, [key]: { ...prev[key], note } }));
  };

  const toggleNote = (key) => {
    setExpandedNotes(prev => ({ ...prev, [key]: !prev[key] }));
  };

  const sections = ['Mixture', 'Bubble', 'Other'];

  const handleDone = () => {
    onDone({
      id: initialRating?.id ?? uuid(),
      batch_id: batchId,
      ratings,
      overall_note: overallNote,
    });
  };

  return (
    <div className="flex flex-col h-full">
      <Header
        left={<button onClick={onBack} className="tap px-2 -ml-2 text-base">‹ Back</button>}
        title={title}
      />
      <div className="flex-1 overflow-y-auto">
        {sections.map(section => {
          const props = RATING_PROPERTIES.filter(p => p.section === section);
          return (
            <div key={section}>
              <div className="text-xs font-bold uppercase tracking-wider text-gray-500 px-4 py-2">
                {section}
              </div>
              {props.map((prop, idx) => {
                const entry = ratings[prop.key] || { stars: null, note: '' };
                const noteOpen = expandedNotes[prop.key];
                return (
                  <div key={prop.key}>
                    <div className="px-4 py-3">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-sm font-medium">{prop.label}</span>
                        {!noteOpen && (
                          <button
                            onClick={() => toggleNote(prop.key)}
                            className="text-xs text-gray-400 underline"
                          >
                            Add note
                          </button>
                        )}
                      </div>
                      <StarRow value={entry.stars} onChange={(v) => setStars(prop.key, v)} />
                      {noteOpen && (
                        <div className="mt-2">
                          <textarea
                            value={entry.note}
                            onChange={e => setNote(prop.key, e.target.value)}
                            placeholder="Note…"
                            rows={2}
                            className="w-full border border-gray-300 rounded px-2 py-1 text-sm resize-none"
                          />
                          {!entry.note && (
                            <button
                              onClick={() => toggleNote(prop.key)}
                              className="text-xs text-gray-400 underline mt-1"
                            >
                              Hide
                            </button>
                          )}
                        </div>
                      )}
                    </div>
                    {idx < props.length - 1 && <div className="border-b border-gray-100 mx-4" />}
                  </div>
                );
              })}
            </div>
          );
        })}
        <div className="h-4" />
      </div>
      <div className="border-t border-gray-200 px-4 py-4 bg-white">
        <textarea
          value={overallNote}
          onChange={e => setOverallNote(e.target.value)}
          placeholder="Overall note…"
          rows={2}
          className="w-full border border-gray-300 rounded px-3 py-2 text-sm resize-none mb-3"
        />
        <button
          onClick={handleDone}
          className="w-full bg-black text-white font-semibold py-3 rounded-xl text-base"
        >
          Done
        </button>
      </div>
    </div>
  );
}

function HistoryTab({ state }) {
  const [segment, setSegment] = React.useState('sessions');
  const [sessionDetail, setSessionDetail] = React.useState(null); // session object or null
  const [rankingDetail, setRankingDetail] = React.useState(null); // ranking object or null
  const [weatherFilter, setWeatherFilter] = React.useState('all');

  // Sessions segment
  const endedSessions = React.useMemo(() =>
    [...state.sessions]
      .filter(s => s.ended_at !== null)
      .sort((a, b) => new Date(b.ended_at) - new Date(a.ended_at)),
    [state.sessions]
  );

  // Rankings segment
  const rankings = React.useMemo(() =>
    computeRankings(state.recipes, state.batches, state.sessions, weatherFilter),
    [state.recipes, state.batches, state.sessions, weatherFilter]
  );

  // Session detail view
  if (sessionDetail) {
    const s = sessionDetail;
    return (
      <div className="flex flex-col h-full">
        <Header
          left={
            <button onClick={() => setSessionDetail(null)} className="tap px-2 -ml-2 text-base">
              ‹ Sessions
            </button>
          }
          title={new Date(s.ended_at).toLocaleDateString()}
        />
        <div className="flex-1 overflow-y-auto">
          <div className="px-4 pt-3 pb-3 border-b border-gray-100 flex gap-2 flex-wrap">
            <span className="rounded-full border border-gray-300 px-3 py-1 text-sm capitalize">
              {s.conditions.weather}
            </span>
            <span className="rounded-full border border-gray-300 px-3 py-1 text-sm capitalize">
              {s.conditions.wind} wind
            </span>
          </div>
          {s.batch_ratings.length === 0 ? (
            <div className="text-center py-10 text-gray-400 text-sm">No batches rated in this session.</div>
          ) : (
            s.batch_ratings.map(br => {
              const batch = state.batches.find(b => b.id === br.batch_id);
              const recipe = batch ? state.recipes.find(r => r.id === batch.recipe_id) : null;
              return (
                <div key={br.id} className="px-4 pt-4 pb-3 border-b border-gray-100">
                  <div className="font-semibold text-base mb-2">
                    {batch ? `Batch #${batch.number}` : 'Unknown batch'}
                    {recipe ? ` · ${autoName(recipe)}` : ''}
                  </div>
                  {RATING_PROPERTIES.map(prop => {
                    const entry = br.ratings?.[prop.key];
                    return (
                      <div key={prop.key} className="flex items-center justify-between py-1">
                        <span className="text-sm text-gray-600">{prop.label}</span>
                        <span className="text-sm font-medium tabular-nums">
                          {entry?.stars != null ? `${entry.stars}★` : '—'}
                        </span>
                      </div>
                    );
                  })}
                  {br.overall_note ? (
                    <div className="mt-2 text-sm text-gray-500 italic">{br.overall_note}</div>
                  ) : null}
                </div>
              );
            })
          )}
          <div className="h-8" />
        </div>
      </div>
    );
  }

  // Ranking detail view
  if (rankingDetail) {
    const rd = rankingDetail;
    const recipe = state.recipes.find(r => r.id === rd.recipeId);
    // Collect qualifying batch_ratings for this recipe
    const qualifyingRatings = state.sessions
      .filter(s => s.ended_at !== null && (weatherFilter === 'all' || s.conditions.weather === weatherFilter))
      .flatMap(s => (s.batch_ratings || []).map(br => ({ br, session: s })))
      .filter(({ br }) => {
        const batch = state.batches.find(b => b.id === br.batch_id);
        return batch && batch.recipe_id === rd.recipeId;
      });

    return (
      <div className="flex flex-col h-full">
        <Header
          left={
            <button onClick={() => setRankingDetail(null)} className="tap px-2 -ml-2 text-base">
              ‹ Rankings
            </button>
          }
          title={recipe ? autoName(recipe) : 'Recipe'}
        />
        <div className="flex-1 overflow-y-auto">
          <div className="px-4 pt-4 pb-2 border-b border-gray-100">
            <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-3">Per-property averages</div>
            {RATING_PROPERTIES.map(prop => {
              const stars = qualifyingRatings.flatMap(({ br }) => {
                const entry = br.ratings?.[prop.key];
                return entry?.stars != null ? [entry.stars] : [];
              });
              const avg = stars.length
                ? (stars.reduce((a, b) => a + b, 0) / stars.length).toFixed(1)
                : '—';
              return (
                <div key={prop.key} className="flex items-center justify-between py-1.5">
                  <span className="text-sm text-gray-700">{prop.label}</span>
                  <span className="text-sm font-semibold tabular-nums">
                    {avg !== '—' ? `${avg}★` : '—'}
                  </span>
                </div>
              );
            })}
          </div>

          <div className="px-4 pt-4 pb-2">
            <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-3">
              Contributing sessions ({qualifyingRatings.length})
            </div>
            {qualifyingRatings.length === 0 ? (
              <div className="text-sm text-gray-400">No data.</div>
            ) : (
              qualifyingRatings.map(({ br, session }, idx) => {
                const batch = state.batches.find(b => b.id === br.batch_id);
                const recipeName = recipe ? autoName(recipe) : 'Unknown';
                return (
                  <div key={idx} className="py-3 border-b border-gray-100">
                    <div className="text-sm font-semibold">
                      {batch ? `Batch #${batch.number}` : 'Unknown batch'} · {recipeName}
                    </div>
                    <div className="text-xs text-gray-500 mt-0.5">
                      {new Date(session.ended_at).toLocaleDateString()} · {session.conditions.weather} / {session.conditions.wind} wind
                    </div>
                    {br.overall_note ? (
                      <div className="text-xs text-gray-400 italic mt-0.5">{br.overall_note}</div>
                    ) : null}
                  </div>
                );
              })
            )}
          </div>
          <div className="h-8" />
        </div>
      </div>
    );
  }

  // Main history view
  return (
    <div className="flex flex-col h-full">
      <Header title="History" />

      {/* Segmented control */}
      <div className="flex bg-gray-100 rounded-full p-1 self-start mx-4 my-3">
        {[['sessions', 'Sessions'], ['rankings', 'Rankings']].map(([id, label]) => (
          <button
            key={id}
            onClick={() => setSegment(id)}
            className={classNames(
              'px-4 py-1 text-sm font-semibold rounded-full transition-colors',
              segment === id ? 'bg-black text-white' : 'text-gray-500'
            )}
          >
            {label}
          </button>
        ))}
      </div>

      {segment === 'sessions' && (
        <div className="flex-1 overflow-y-auto">
          {endedSessions.length === 0 ? (
            <div className="text-center py-16 text-gray-400">No sessions yet.</div>
          ) : (
            <ul>
              {endedSessions.map(s => (
                <li key={s.id}>
                  <button
                    onClick={() => setSessionDetail(s)}
                    className="w-full text-left px-4 py-4 border-b border-gray-200 active:bg-gray-50 flex items-center justify-between gap-3"
                  >
                    <div className="flex-1 min-w-0">
                      <div className="font-semibold text-base">
                        {new Date(s.ended_at).toLocaleDateString()}
                      </div>
                      <div className="flex gap-1.5 flex-wrap mt-1">
                        <span className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full capitalize">{s.conditions.weather}</span>
                        <span className="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full capitalize">{s.conditions.wind} wind</span>
                      </div>
                      <div className="text-sm text-gray-500 mt-1">
                        {s.batch_ratings.length} batch{s.batch_ratings.length !== 1 ? 'es' : ''} tested
                      </div>
                    </div>
                    <span className="text-gray-400 text-lg shrink-0">›</span>
                  </button>
                </li>
              ))}
            </ul>
          )}
        </div>
      )}

      {segment === 'rankings' && (
        <div className="flex-1 overflow-y-auto">
          {/* Weather filter */}
          <div className="flex gap-2 px-4 pb-3 flex-wrap">
            {['all', 'cold', 'mild', 'warm', 'hot'].map(w => (
              <button
                key={w}
                onClick={() => setWeatherFilter(w)}
                className={classNames(
                  'px-3 py-1 rounded-full text-sm font-medium capitalize',
                  weatherFilter === w ? 'bg-black text-white' : 'bg-gray-100 text-gray-700'
                )}
              >
                {w === 'all' ? 'All' : w}
              </button>
            ))}
          </div>

          {rankings.length === 0 ? (
            <div className="text-center py-16 text-gray-400">No ratings yet.</div>
          ) : (
            <ul>
              {rankings.map((rd, idx) => {
                const recipe = state.recipes.find(r => r.id === rd.recipeId);
                return (
                  <li key={rd.recipeId}>
                    <button
                      onClick={() => setRankingDetail(rd)}
                      className="w-full text-left px-4 py-4 border-b border-gray-200 active:bg-gray-50 flex items-center gap-3"
                    >
                      <div className="text-lg font-bold text-gray-400 tabular-nums w-8 shrink-0">
                        #{idx + 1}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="font-semibold text-base truncate">
                          {recipe ? autoName(recipe) : 'Unknown recipe'}
                        </div>
                        <div className="text-sm text-gray-500">
                          {rd.batchCount} batch{rd.batchCount !== 1 ? 'es' : ''}
                        </div>
                      </div>
                      <div className="text-right shrink-0">
                        <div className="font-bold tabular-nums">{rd.avgScore.toFixed(1)}★</div>
                      </div>
                    </button>
                  </li>
                );
              })}
            </ul>
          )}
        </div>
      )}
    </div>
  );
}

/* ============================================================
   APP ROOT
   ============================================================ */

function App() {
  const [state, dispatch] = useReducer(reducer, null, () => migrate(loadState()));
  useEffect(() => { saveState(state); }, [state]);

  const [tab, setTab] = useState('recipes');
  const [view, setView] = useState({ kind: 'list' });

  let content = null;

  if (tab === 'recipes') {
    if (view.kind === 'list') {
      content = <RecipeList
        recipes={state.recipes}
        onOpen={(id) => setView({ kind: 'recipe', id, liters: null, checked: {} })}
        onNew={() => setView({ kind: 'edit', id: null })}
        onSettings={() => setView({ kind: 'settings' })}
      />;
    } else if (view.kind === 'recipe') {
      const recipe = state.recipes.find(r => r.id === view.id);
      if (!recipe) { setView({ kind: 'list' }); return null; }
      content = <RecipeDetail
        recipe={recipe}
        viewState={view}
        setViewState={setView}
        onBack={() => setView({ kind: 'list' })}
        onEdit={() => setView({ kind: 'edit', id: recipe.id })}
        onDelete={() => {
          if (window.confirm(`Delete "${autoName(recipe)}"?`)) {
            dispatch({ type: 'DELETE_RECIPE', id: recipe.id });
            setView({ kind: 'list' });
          }
        }}
        onMakeBatch={(batch) => dispatch({ type: 'ADD_BATCH', batch })}
        nextBatchNumber={state.next_batch_number}
        state={state}
      />;
    } else if (view.kind === 'edit') {
      const recipe = view.id ? state.recipes.find(r => r.id === view.id) : null;
      content = <RecipeEditor
        recipe={recipe}
        onCancel={() => setView(recipe
          ? { kind: 'recipe', id: recipe.id, liters: null, checked: {} }
          : { kind: 'list' })}
        onSave={(saved) => {
          if (recipe) dispatch({ type: 'UPDATE_RECIPE', recipe: saved });
          else dispatch({ type: 'ADD_RECIPE', recipe: saved });
          setView({ kind: 'recipe', id: saved.id, liters: null, checked: {} });
        }}
        onDelete={recipe ? () => {
          if (window.confirm(`Delete "${autoName(recipe)}"?`)) {
            dispatch({ type: 'DELETE_RECIPE', id: recipe.id });
            setView({ kind: 'list' });
          }
        } : null}
      />;
    } else if (view.kind === 'settings') {
      content = <SettingsScreen
        state={state}
        dispatch={dispatch}
        onClose={() => setView({ kind: 'list' })}
      />;
    }
  } else if (tab === 'field') {
    content = <FieldTab state={state} dispatch={dispatch} />;
  } else if (tab === 'history') {
    content = <HistoryTab state={state} />;
  }

  return (
    <div className="flex flex-col h-full">
      <div className="flex-1 overflow-hidden relative">{content}</div>
      <TabBar tab={tab} setTab={setTab} />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
