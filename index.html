<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useReducer } = React;

/* ============================================================
   CONSTANTS
   ============================================================ */

const STORAGE_KEY = 'bubble-lab-v1';
const SCHEMA_VERSION = 4;

const SURFACTANTS = ['SLES', 'AOS', 'CAPB', 'LDAO'];
const POLYMERS = ['PEO', 'PAM', 'HEC', 'J Lube'];
const COMMON_OTHERS = [
  'Distilled water',
  'Vegetable glycerin',
  'Isopropyl alcohol',
  'Tetrasodium EDTA',
  'Sorbic acid',
  'Potassium sorbate',
  'Dipotassium phosphate',
  'Lactic acid 80%',
];

const DEFAULT_CONCENTRATES = [
  { id: 'conc-hec',    name: 'HEC',         gPerML: 0.021,  aqueous: true  },
  { id: 'conc-pam',    name: 'PAM',         gPerML: 0.0005, aqueous: true  },
  { id: 'conc-peo',    name: 'PEO',         gPerML: 0.002,  aqueous: true  },
  { id: 'conc-jlube',  name: 'J Lube',      gPerML: 0.008,  aqueous: true  },
  { id: 'conc-sorbic', name: 'Sorbic acid', gPerML: 0.0671, aqueous: false },
];

const RATING_PROPERTIES = [
  { key: 'thickness',      label: 'Thickness',      section: 'Mixture' },
  { key: 'stringiness',    label: 'Stringiness',    section: 'Mixture' },
  { key: 'expansion_rate', label: 'Expansion rate', section: 'Bubble' },
  { key: 'closure_rate',   label: 'Closure rate',   section: 'Bubble' },
  { key: 'tube_length',    label: 'Tube length',    section: 'Bubble' },
  { key: 'size',           label: 'Size',           section: 'Bubble' },
  { key: 'weight',         label: 'Weight',         section: 'Bubble' },
  { key: 'ghosting',       label: 'Ghosting',       section: 'Other'  },
];

// Lower number = higher priority for naming prefix
const SURF_PRIORITY = { SLES: 0, AOS: 1, CAPB: 2, LDAO: 3 };
const POLY_ORDER    = { PAM: 0, PEO: 1, HEC: 2, 'J Lube': 3 };

/* ============================================================
   UTILS
   ============================================================ */

function uuid() {
  if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function findConcentrate(row, concentrates) {
  if (!concentrates || !concentrates.length) return null;
  const short = (row.short || '').toLowerCase().trim();
  const label = (row.label || '').toLowerCase().trim();
  return concentrates.find(c => {
    const name = c.name.toLowerCase().trim();
    return (short && short === name) || label.includes(name);
  }) || null;
}

function round(v, sig = 4) {
  if (v == null || isNaN(v) || v === 0) return v || 0;
  const d = Math.ceil(Math.log10(Math.abs(v)));
  const f = Math.pow(10, sig - d);
  return Math.round(v * f) / f;
}

function fmtNum(n) {
  if (n == null || isNaN(n)) return '—';
  let s;
  if (Math.abs(n) >= 100) s = n.toFixed(1);
  else if (Math.abs(n) >= 1) s = n.toFixed(2);
  else s = n.toFixed(4);
  if (s.includes('.')) {
    s = s.replace(/0+$/, '');
    if (s.endsWith('.')) s = s.slice(0, -1);
  }
  return s;
}

function fmtG(v) {
  if (v == null || isNaN(v)) return '—';
  return fmtNum(v) + ' g';
}

function fmtAge(createdAt) {
  const ms = Date.now() - new Date(createdAt).getTime();
  const totalMins = Math.floor(ms / 60000);
  const days = Math.floor(totalMins / 1440);
  const hrs  = Math.floor((totalMins % 1440) / 60);
  if (days > 0) return `${days}d ${hrs}h`;
  if (hrs > 0) return `${hrs}h`;
  return `${totalMins}m`;
}

function ratingCount(batchRating) {
  if (!batchRating || !batchRating.ratings) return 0;
  return RATING_PROPERTIES.filter(p => batchRating.ratings[p.key]?.stars != null).length;
}

function avgScore(batchRating) {
  if (!batchRating || !batchRating.ratings) return null;
  const vals = RATING_PROPERTIES.map(p => batchRating.ratings[p.key]?.stars).filter(v => v != null);
  if (vals.length === 0) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function emptyRatings() {
  const r = {};
  for (const p of RATING_PROPERTIES) r[p.key] = { stars: null, note: '' };
  return r;
}

function computeRankings(recipes, batches, sessions, weatherFilter) {
  const eligible = sessions.filter(s =>
    s.ended_at !== null && (weatherFilter === 'all' || s.conditions.weather === weatherFilter)
  );
  const map = {};
  for (const session of eligible) {
    for (const br of (session.batch_ratings || [])) {
      const batch = batches.find(b => b.id === br.batch_id);
      if (!batch) continue;
      const rid = batch.recipe_id;
      if (!map[rid]) map[rid] = { recipeId: rid, scores: [] };
      const vals = RATING_PROPERTIES.map(p => br.ratings?.[p.key]?.stars).filter(v => v != null);
      if (vals.length === 0) continue;
      const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
      map[rid].scores.push(avg);
    }
  }
  return Object.values(map)
    .map(e => ({
      recipeId: e.recipeId,
      avgScore: e.scores.length ? e.scores.reduce((a, b) => a + b, 0) / e.scores.length : null,
      batchCount: e.scores.length,
    }))
    .filter(e => e.avgScore !== null)
    .sort((a, b) => b.avgScore - a.avgScore);
}

function classNames(...xs) { return xs.filter(Boolean).join(' '); }

function shortenSurfactantName(name) {
  if (!name) return null;
  const n = name.toLowerCase();
  if (n.includes('sles')) return 'SLES';
  if (n.includes('aos')) return 'AOS';
  if (n.includes('capb')) return 'CAPB';
  if (n.includes('ldao')) return 'LDAO';
  return null;
}

/* ============================================================
   AUTO-NAME
   ============================================================ */

function autoName(recipe) {
  if (recipe.custom_name && recipe.custom_name.trim()) return recipe.custom_name;
  const rows = recipe.rows || [];
  const surfs = rows.filter(r => r.role === 'surfactant' && r.short && SURFACTANTS.includes(r.short));
  const polys = rows.filter(r => r.role === 'polymer' && r.short && POLYMERS.includes(r.short));
  surfs.sort((a, b) => (SURF_PRIORITY[a.short] ?? 9) - (SURF_PRIORITY[b.short] ?? 9));
  polys.sort((a, b) => (POLY_ORDER[a.short] ?? 9) - (POLY_ORDER[b.short] ?? 9));

  if (surfs.length === 0 && polys.length === 0) {
    return rows[0]?.label || 'New recipe';
  }
  const prefix = surfs[0]?.short || (rows.find(r => r.role === 'surfactant')?.label) || 'Recipe';
  if (polys.length === 0) return prefix;
  const parts = polys.map(p => {
    const g = (p.active_g_per_L != null && !isNaN(p.active_g_per_L)) ? p.active_g_per_L : p.grams_per_L;
    return `${fmtNum(g)}g ${p.short}`;
  });
  return `${prefix}: ${parts.join(' & ')}`;
}

/* ============================================================
   SEED RECIPES (per 1 liter base)
   ============================================================ */

function seedRecipes() {
  return [
    {

        'Grounded honest rewrite — see "obsidian-vault/research/00-world-class-recipe-v2.md". Recreates Fairy\'s working surfactant architecture (SLES + CAPB + LDAO) from raw materials, drops the cosmetic junk (perfume, dye, preservatives, salt thickener, PEG-cocoate, citrate/NaOH pH adjusters), and adds the two bubble-specific things Fairy lacks: 10% glycerin (Pasquet 2022 measured 140× lifetime) and one polymer at its empirical working range. Total surfactant actives 2.0% — slight margin above Pasquet\'s 1.5% empirical ceiling.\n\n' +
        'TOP 3 #1 — THE DAILY DRIVER. Three working recipes form the Top 3 (see "obsidian-vault/research/11-top-3-brew-sheet.md" for the side-by-side comparison): #1 this Fairy-architecture HEC (default), #2 AOS Wind-Tolerant (windy days), #3 816 g Corrected (calm-air record hunt). Same three rules apply to all three — distilled water only, EDTA for chelation, slow paddle never blender.\n\nWHY THIS IS #1 (longest shelf life, most forgiving, hardest to mess up):\n' +

        '• Pasquet 2022 MEASURED peak lifetime at 10% glycerin (140× vs 0%). The previous v2 used 8%. We now use 10%.\n' +
        '• AOS has near-zero documented giant-bubble recipes in the open practitioner literature, but appears to be the secret in pro UK commercial mixes (Bubble Inc Supapop, Bubblyheaven). SLES + CAPB appears in Flavour Blaster commercial INCI (water/SLES/CAPB/HEC/glycerin/preservative) and in Frazier\'s Dawn benchmark. This seed follows the well-documented Fairy-recreation path; the AOS path is the separate wind-tolerant variant seed (Section 13 of the recipe doc).\n\n' +
        'THIS SEED USES HEC POLYMER (matches commercial Flavour Blaster INCI). Two alternative polymer variants exist as separate seeds — guar (Pasquet measured optimum) and J-Lube (BLM/HECP practitioner). Run all three side-by-side as a bake-off — winner depends on your water, wand, and conditions.\n\n' +
        'MIXING PROTOCOL — no buffer, no acid, simple:\n\n' +
        '1) Polymer slurry: in a 250 mL beaker, add 100 g glycerin. Sprinkle in 2.2 g HEC Cellosize QP-100MH while stirring with a dry spatula. Glycerin pre-wets the polymer so it doesn\'t fish-eye.\n' +
        '2) Water + EDTA: 875 g distilled water in a 2 L bucket. Add 0.5 g disodium EDTA, stir to dissolve. Water optically clear.\n' +
        '3) Polymer hydration: slow paddle (NOT high-shear blender — that scissions the polymer). Pour glycerin/polymer slurry into vortex centre over 30 s. Gentle paddle 5 min only. Cover. Rest UNDISTURBED 12–24 hr.\n' +

        '6) Decant 200–500 mL for sessions. Shelf life 2 weeks unrefrigerated, 6 weeks refrigerated.\n\n' +

        'HARD-WATER NOTE: Scotland soft (30–70 mg/L CaCO₃) → EDTA 0.5 g/L is fine. London/Hull very hard → bump EDTA to 2.0 g/L. Distilled water always cleaner.',
      rows: [
        { id: uuid(), role: 'other',      label: 'Distilled water',         grams_per_L: 875,   active_g_per_L: null,  short: null,    skip_convert: false },
        { id: uuid(), role: 'other',      label: 'Vegetable glycerin USP',  grams_per_L: 100,   active_g_per_L: null,  short: null,    skip_convert: false },
        { id: uuid(), role: 'other',      label: 'Disodium EDTA',           grams_per_L: 0.5,   active_g_per_L: null,  short: null,    skip_convert: false },
        { id: uuid(), role: 'polymer',    label: 'HEC Cellosize QP-100MH',  grams_per_L: 2.2,   active_g_per_L: 2.2,   short: 'HEC',   skip_convert: false },
        { id: uuid(), role: 'surfactant', label: 'SLES-70 paste',           grams_per_L: 20,    active_g_per_L: null,  short: 'SLES',  skip_convert: false },
        { id: uuid(), role: 'surfactant', label: 'CAPB-30',                 grams_per_L: 15,    active_g_per_L: null,  short: 'CAPB',  skip_convert: false },
        { id: uuid(), role: 'surfactant', label: 'LDAO-30 (Ammonyx LO)',    grams_per_L: 5,     active_g_per_L: null,  short: 'LDAO',  skip_convert: false },
      ],
    },
    {
      id: uuid(),

        'Polymer bake-off variant of v2 grounded honest. Same SLES+CAPB+LDAO surfactant stack, same 10% glycerin, same free-running pH, same EDTA — but swaps HEC for guar gum at 0.15% w/v (1.5 g/L). Why guar: Pasquet 2022 MEASURED 0.1% guar as the optimum with 4% Fairy + 10% glycerin. Scaled up to 0.15% here to compensate for the lower total surfactant on this base.\n\n' +

        { id: uuid(), role: 'polymer',    label: 'Guar gum (food grade)',   grams_per_L: 1.5,   active_g_per_L: 1.5,   short: 'Guar',  skip_convert: false },
        { id: uuid(), role: 'surfactant', label: 'SLES-70 paste',           grams_per_L: 20,    active_g_per_L: null,  short: 'SLES',  skip_convert: false },
        { id: uuid(), role: 'surfactant', label: 'CAPB-30',                 grams_per_L: 15,    active_g_per_L: null,  short: 'CAPB',  skip_convert: false },
        { id: uuid(), role: 'surfactant', label: 'LDAO-30 (Ammonyx LO)',    grams_per_L: 5,     active_g_per_L: null,  short: 'LDAO',  skip_convert: false },
      ],
    },
    {
      id: uuid(),
      custom_name: 'World-Class v2 (J-Lube bake-off variant) — polydisperse PEO practitioner path',
      notes:

      rows: [
        { id: uuid(), role: 'other',      label: 'Distilled water',         grams_per_L: 875,   active_g_per_L: null,  short: null,    skip_convert: false },
        { id: uuid(), role: 'other',      label: 'Vegetable glycerin USP',  grams_per_L: 100,   active_g_per_L: null,  short: null,    skip_convert: false },
        { id: uuid(), role: 'other',      label: 'Disodium EDTA',           grams_per_L: 0.5,   active_g_per_L: null,  short: null,    skip_convert: false },

      notes:
        'TOP 3 #2 — THE WIND RECIPE — see Section 13 of "obsidian-vault/research/00-world-class-recipe-v2.md", full citation trail in "obsidian-vault/research/09-aos-science-deep-dive.md", and the full Top-3 brew sheet at "obsidian-vault/research/11-top-3-brew-sheet.md". Science-supported alternative architecture optimised for wind tolerance — the answer to "huge bubbles in calm but they die in any wind."\n\n' +

        '• The user\'s previous best 816 g recipe (SLES+CAPB+LDAO+APAM+PEO at pH 6.1, sorbic-acid-locked) gave 100 ft / 200 ft bubbles in calm air but failed in any wind. Analysis (07-816g-recipe-analysis.md): pH 6.1 sits below CAPB\'s isoelectric pH 6.25, creating a CAPB-SLES coacervate that\'s strong in still air but shear-melts in turbulence.\n' +

        'SCIENCE BACKING (MEASURED, not speculation):\n' +
        '• Bergeron 1996 Langmuir 12:5751 — oscillatory disjoining pressure up to 200 Pa from polyelectrolyte chain networks at 10 nm thickness.\n' +
        '• von Klitzing 2002 J. Phys. Chem. B 106:11769 — polyelectrolyte mesh stratification step measurement.\n' +
        '• Yekeen 2018 J. Ind. Eng. Chem. — AOS+HPAM most stable foam vs commercial baselines.\n' +
        '• MDPI Energies 2023 16(22):7523 — AOS+HPAM reservoir-stable foam at 140 °C.\n' +
        '• Farajzadeh 2008 Colloids Surf A 324:35 — AOS NBF transition; AOS film stretchability greater than SDS.\n' +
        '• Linfield 1972 JAOCS — AOS lime-soap dispersancy (hard-water tolerance).\n' +
        '• Marinova 2009 — CAPB pI 6.25 is the reason CAPB is omitted from this variant.\n\n' +
        'TRADE-OFFS VS THE FAIRY-RECREATION MAINLINE:\n' +
        '• Calm-air bubble size: this variant likely BEST (long extensional viscosity from APAM; stratification stability from oscillatory disjoining pressure).\n' +

        '• Still-air single-bubble lifetime: Fairy-recreation mainline likely BEST (Pasquet measured 140× lifetime at 10% glycerin with dish-soap synergy at higher G\').\n' +

        '6) AOS + LDAO (T + 12 hr): slow paddle. Add 60 g AOS-40 over 30 s. Then 5 g LDAO-30 over 30 s. Fold 5 min. Mix optically clear, very pale straw, no foam in the bucket.\n' +
        '7) Final rest (T + 12 hr → T + 60 hr): cover, rest cool dark 48 hr. Performance peaks T + 48–72 hr.\n\n' +

/* ============================================================
   STORAGE / MIGRATION
   ============================================================ */

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch { return null; }
}

function saveState(state) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      version: SCHEMA_VERSION,
      recipes: state.recipes,
      batches: state.batches,
      sessions: state.sessions,
      next_batch_number: state.next_batch_number,
    }));
  } catch (e) { console.error(e); }
}

function migrate(loaded) {
  if (!loaded) return {
    version: SCHEMA_VERSION, recipes: seedRecipes(),
    batches: [], sessions: [], next_batch_number: 1,
    concentrates: DEFAULT_CONCENTRATES,
  };

  // v2/v3 data: recipes already have rows array
  if ((loaded.recipes || []).every(r => Array.isArray(r.rows))) {
    const OLD_NAMES = new Set([
      'Steady Breeze (AOS)', 'Scottish Standard (AOS)', 'Extreme Extensional Limit (AOS)',
      'Steady Breeze (SLES)', 'Scottish Standard (SLES)', 'Extreme Extensional Limit (SLES)',
    ]);
    const cleanedRecipes = (loaded.recipes || []).map(r =>
      OLD_NAMES.has(r.custom_name) ? { ...r, custom_name: '' } : r
    );
    // Step 1: Remove bare-name stubs (corrupted records from previous migrations)
    const BARE_REMOVE = new Set(['AOS', 'SLES']);
    let recipes = cleanedRecipes.filter(r => !BARE_REMOVE.has(autoName(r)));
    // Step 2: Deduplicate by autoName (keep first occurrence)
    const seen = new Set();
    recipes = recipes.filter(r => {
      const n = autoName(r);
      if (seen.has(n)) return false;
      seen.add(n);
      return true;
    });
    // Step 3: Fix HEC rows incorrectly stored as dry powder (skip_convert: true)
    recipes = recipes.map(r => ({
      ...r,
      rows: r.rows.map(row => {
        if (row.role === 'polymer' && row.short === 'HEC' && row.skip_convert) {
          return { ...row, skip_convert: false, label: row.label.replace('HEC Powder / ', '') };
        }
        return row;
      }),
    }));
    const seeds = seedRecipes();
    const existingNames = new Set(recipes.map(r => r.custom_name || autoName(r)));
    const toAdd = seeds.filter(s => {
      const name = s.custom_name || autoName(s);
      return !existingNames.has(name);
    });
    return {
      version: SCHEMA_VERSION,
      recipes: [...recipes, ...toAdd],
      batches: loaded.batches || [],
      sessions: loaded.sessions || [],
      next_batch_number: loaded.next_batch_number || 1,
      concentrates: loaded.concentrates || DEFAULT_CONCENTRATES,
    };
  }

  // v1 → v2 migration (original logic preserved)
  const stocksById = {};
  for (const s of loaded.stocks || []) stocksById[s.id] = s;

  const migrated = (loaded.recipes || []).map(r => {
    if (Array.isArray(r.rows)) return r;
    const liters = (r.target_volume_mL || 1000) / 1000;
    const rows = (r.ingredients || []).map(ing => {
      const stock = stocksById[ing.stock_id];
      if (!stock) return null;
      let gramsPerL = 0, activeGperL = null;
      if (ing.target_type === 'mass_g') {
        gramsPerL = ing.target_value / liters;
        if (stock.category === 'polymer') activeGperL = gramsPerL;
      } else if (ing.target_type === 'volume_mL') {
        gramsPerL = ing.target_value / liters;
      } else if (ing.target_type === 'ppm') {
        if (stock.ingredient_type === 'polymer_concentrate' && stock.concentration_unit === 'g_per_mL') {
          activeGperL = ing.target_value / 1000;
          gramsPerL = activeGperL / stock.concentration_value;
        } else { gramsPerL = ing.target_value / 1000; activeGperL = gramsPerL; }
      } else if (ing.target_type === 'percent_active') {
        activeGperL = ing.target_value * 10;
        const af = stock.concentration_unit === 'percent_active' ? stock.concentration_value / 100 : 1;
        gramsPerL = af > 0 ? activeGperL / af : 0;
      }
      let role = 'other', short = null;
      if (['anionic', 'amphoteric', 'nonionic'].includes(stock.category)) {
        role = 'surfactant'; short = shortenSurfactantName(stock.name);
      } else if (stock.category === 'polymer') { role = 'polymer'; short = stock.polymer_type || null; }
      return { id: uuid(), role, label: stock.name, grams_per_L: round(gramsPerL, 4),
               active_g_per_L: activeGperL != null ? round(activeGperL, 4) : null, short };
    }).filter(Boolean);
    return { id: r.id || uuid(), custom_name: null, notes: r.protocol_notes || '', rows };
  });

  const seeds = seedRecipes();
  const existingNames = new Set(migrated.map(autoName));
  const toAdd = seeds.filter(s => !existingNames.has(autoName(s)));
  return {
    version: SCHEMA_VERSION,
    recipes: [...migrated, ...toAdd],
    batches: [], sessions: [], next_batch_number: 1,
    concentrates: DEFAULT_CONCENTRATES,
  };
}

/* ============================================================
   REDUCER
   ============================================================ */

function reducer(state, a) {
  switch (a.type) {
    case 'ADD_RECIPE':    return { ...state, recipes: [...state.recipes, a.recipe] };
    case 'UPDATE_RECIPE': return { ...state, recipes: state.recipes.map(r => r.id === a.recipe.id ? a.recipe : r) };
    case 'DELETE_RECIPE': return { ...state, recipes: state.recipes.filter(r => r.id !== a.id) };
    case 'ADD_BATCH':
      return { ...state, batches: [...state.batches, a.batch], next_batch_number: state.next_batch_number + 1 };
    case 'UPDATE_BATCH':
      return { ...state, batches: state.batches.map(b => b.id === a.batch.id ? a.batch : b) };
    case 'DELETE_BATCH':
      return { ...state, batches: state.batches.filter(b => b.id !== a.id) };
    case 'ADD_SESSION':
      return { ...state, sessions: [...state.sessions, a.session] };
    case 'UPDATE_SESSION':
      return { ...state, sessions: state.sessions.map(s => s.id === a.session.id ? a.session : s) };
    case 'RESET': return {
      version: SCHEMA_VERSION,
      recipes: seedRecipes(),
      batches: [], sessions: [],
      next_batch_number: 1,
      concentrates: DEFAULT_CONCENTRATES,
    };
    case 'ADD_CONCENTRATE':
      return { ...state, concentrates: [...(state.concentrates || []), a.concentrate] };
    case 'UPDATE_CONCENTRATE':
      return { ...state, concentrates: (state.concentrates || []).map(c => c.id === a.concentrate.id ? a.concentrate : c) };
    case 'DELETE_CONCENTRATE':
      return { ...state, concentrates: (state.concentrates || []).filter(c => c.id !== a.id) };
    default: return state;
  }
}

/* ============================================================
   RECIPE LIST
   ============================================================ */

function getSurfGroup(recipe) {
  for (const r of recipe.rows) {
    if (r.role !== 'surfactant') continue;
    if (r.short === 'AOS') return 'AOS';
    if (r.short === 'SLES') return 'SLES';
    if (r.label && r.label.toLowerCase().includes('fairy')) return 'Fairy';
  }
  return 'Other';
}

function getPolyGroup(recipe) {
  const shorts = recipe.rows.filter(r => r.role === 'polymer').map(r => r.short);
  if (shorts.includes('J Lube')) return 'J-Lube';
  if (shorts.includes('HEC')) return 'HEC';
  return 'Other';
}

function RecipeList({ recipes, onOpen, onNew, onResetAll, onSettings }) {
  const [surfFilter, setSurfFilter] = React.useState('All');
  const [polyFilter, setPolyFilter] = React.useState('All');

  const sorted = useMemo(() => [...recipes].sort((a, b) => autoName(a).localeCompare(autoName(b))), [recipes]);

  const filtered = useMemo(() => sorted.filter(r => {
    if (surfFilter !== 'All' && getSurfGroup(r) !== surfFilter) return false;
    if (polyFilter !== 'All' && getPolyGroup(r) !== polyFilter) return false;
    return true;
  }), [sorted, surfFilter, polyFilter]);

  const SURF_OPTS = ['All', 'AOS', 'SLES', 'Fairy'];
  const POLY_OPTS = ['All', 'J-Lube', 'HEC'];

  function FilterPill({ label, active, onClick }) {
    return (
      <button
        onClick={onClick}
        className={`px-3 py-1 rounded-full text-sm font-medium whitespace-nowrap transition-colors ${
          active ? 'bg-gray-800 text-white' : 'bg-gray-100 text-gray-600 active:bg-gray-200'
        }`}
      >
        {label}
      </button>
    );
  }

  return (
    <div className="flex flex-col h-full">
      <Header
        left={<button onClick={onSettings} className="tap px-3 -ml-3 text-xl">⚙️</button>}
        title="Recipes"
        right={<button onClick={onNew} className="tap px-3 -mr-3 text-base font-semibold">+ New</button>}
      />
      <div className="px-4 pt-3 pb-2 border-b border-gray-200 space-y-2 flex-shrink-0">
        <div className="flex gap-2 overflow-x-auto hide-scrollbar">
          {SURF_OPTS.map(o => (
            <FilterPill key={o} label={o} active={surfFilter === o} onClick={() => setSurfFilter(o)} />
          ))}
        </div>
        <div className="flex gap-2 overflow-x-auto hide-scrollbar">
          {POLY_OPTS.map(o => (
            <FilterPill key={o} label={o} active={polyFilter === o} onClick={() => setPolyFilter(o)} />
          ))}
        </div>
      </div>
      <div className="flex-1 overflow-y-auto">
        {sorted.length === 0 ? (
          <div className="text-center py-16 px-4">
            <div className="text-4xl mb-3">🫧</div>
            <div className="text-lg font-semibold mb-1">No recipes yet</div>
            <div className="text-sm text-gray-500 mb-6">Create your first one.</div>
            <div className="max-w-xs mx-auto">
              <PrimaryBtn onClick={onNew}>+ New recipe</PrimaryBtn>
            </div>
          </div>
        ) : filtered.length === 0 ? (
          <div className="text-center py-12 px-4 text-sm text-gray-400">No recipes match these filters</div>
        ) : (
          <ul>
            {filtered.map(r => (
              <li key={r.id}>
                <button onClick={() => onOpen(r.id)} className="w-full text-left px-4 py-4 border-b border-gray-200 active:bg-gray-50">
                  <div className="font-semibold text-base">{autoName(r)}</div>
                  {r.notes && <div className="text-sm text-gray-500 mt-0.5 line-clamp-1">{r.notes.split('\n')[0]}</div>}
                </button>
              </li>
            ))}
          </ul>
        )}
      </div>
    </div>
  );
}

/* ============================================================
   RECIPE DETAIL — VOLUME PICK + CHECKLIST
   ============================================================ */

function RecipeDetail({ recipe, viewState, setViewState, onBack, onEdit, onDelete, onMakeBatch, nextBatchNumber, state }) {
  const liters = viewState.liters;
  const checked = viewState.checked || {};
  const [makingBatch, setMakingBatch] = useState(false);
  const [editingQtyId, setEditingQtyId] = useState(null);
  const [editingQtyVal, setEditingQtyVal] = useState('');

  const grouped = useMemo(() => {
    const g = { surfactant: [], polymer: [], other: [] };
    for (const row of recipe.rows) (g[row.role] || g.other).push(row);
    return g;
  }, [recipe.rows]);

  // VOLUME PICKER VIEW
  if (!liters) {
    return (
      <div className="flex flex-col h-full">
        <Header
          left={<button onClick={onBack} className="tap px-2 -ml-2 text-base">‹ Back</button>}
          right={<button onClick={onEdit} className="tap px-2 -mr-2 text-base">Edit</button>}
        />
        <div className="flex-1 flex flex-col items-center justify-center px-6">
          <div className="text-2xl font-bold text-center">{autoName(recipe)}</div>
          <div className="mt-12 text-base text-gray-700">How many liters?</div>
          <div className="mt-4 grid grid-cols-5 gap-2 w-full max-w-md">
            {[1, 2, 3, 4, 5].map(L => (
              <button key={L}
                onClick={() => setViewState({ ...viewState, liters: L, checked: {} })}
                className="tap rounded-xl border-2 border-black bg-white text-black active:bg-black active:text-white text-2xl font-bold py-5">
                {L}L
              </button>
            ))}
          </div>
          <div className="mt-12 w-full max-w-md flex gap-2">
            <SecondaryBtn onClick={onEdit} className="flex-1">Edit</SecondaryBtn>
            <SecondaryBtn onClick={() => setMakingBatch(true)} className="flex-1">Make Batch</SecondaryBtn>
            <SecondaryBtn onClick={onDelete} className="flex-1 text-red-600 border-red-300 active:bg-red-50">Delete</SecondaryBtn>
          </div>
        </div>
        {makingBatch && (
          <MakeBatchSheet
            recipe={recipe}
            defaultVolume={viewState.liters || 1}
            nextBatchNumber={nextBatchNumber}
            onMake={onMakeBatch}
            onCancel={() => setMakingBatch(false)}
          />
        )}
      </div>
    );
  }

  // CHECKLIST VIEW
  const quantities = viewState.quantities || {};
  const toggle = (id) => setViewState({ ...viewState, checked: { ...checked, [id]: !checked[id] } });
  const total = recipe.rows.length;
  const done = recipe.rows.filter(r => checked[r.id]).length;
  const allChecked = total > 0 && done === total;

  const sections = [
    ['polymer', 'Polymers'],
    ['other', 'Base & additives'],
    ['surfactant', 'Surfactants'],
  ];

  // Compute concentrate matches using per-row quantity overrides
  const concMatches = {};
  let waterFromConc = 0;
  (recipe.rows || []).forEach(row => {
    if (row.skip_convert) return;
    const c = findConcentrate(row, state.concentrates || []);
    if (c) {
      const effGPL = quantities[row.id] ?? row.grams_per_L;
      const mL = (effGPL * liters) / c.gPerML;
      concMatches[row.id] = { concentrate: c, mL };
      if (c.aqueous) waterFromConc += mL;
    }
  });
  const isWaterRow = r => (r.label || '').toLowerCase().includes('water');

  const startEditQty = (row) => {
    const effGPL = quantities[row.id] ?? row.grams_per_L;
    const match = concMatches[row.id];
    let val;
    if (match) {
      const mL = (effGPL * liters) / match.concentrate.gPerML;
      val = mL < 1 ? (mL * 1000).toFixed(0) : mL.toFixed(1);
    } else {
      const g = effGPL * liters;
      val = g < 1 ? (g * 1000).toFixed(0) : g.toFixed(1);
    }
    setEditingQtyId(row.id);
    setEditingQtyVal(val);
  };

  const saveQty = (row) => {
    const val = parseFloat(editingQtyVal);
    if (!isNaN(val) && val > 0) {
      const effGPL = quantities[row.id] ?? row.grams_per_L;
      const match = concMatches[row.id];
      let newGPL;
      if (match) {
        const origML = (effGPL * liters) / match.concentrate.gPerML;
        const mL = origML < 1 ? val / 1000 : val;
        newGPL = (mL * match.concentrate.gPerML) / liters;
      } else {
        const origG = effGPL * liters;
        const g = origG < 1 ? val / 1000 : val;
        newGPL = g / liters;
      }
      setViewState({ ...viewState, quantities: { ...quantities, [row.id]: newGPL } });
    }
    setEditingQtyId(null);
  };

  const rowAmountText = (row) => {
    const effGPL = quantities[row.id] ?? row.grams_per_L;
    const match = concMatches[row.id];
    if (match) {
      const mL = (effGPL * liters) / match.concentrate.gPerML;
      return mL < 1 ? (mL * 1000).toFixed(0) + ' µL' : mL.toFixed(1) + ' mL';
    }
    if (isWaterRow(row) && waterFromConc > 0) {
      const adjG = Math.max(0, effGPL * liters - waterFromConc);
      return fmtG(adjG) + ' (adj.)';
    }
    return fmtG(effGPL * liters);
  };

  const rowLabelText = (row) => {
    const match = concMatches[row.id];
    if (match) return match.concentrate.name + ' concentrate';
    return row.label;
  };

  return (
    <div className="flex flex-col h-full">
      <Header
        left={<button onClick={() => setViewState({ ...viewState, liters: null })} className="tap px-2 -ml-2 text-base">‹ Volume</button>}
        title={`${liters} L batch`}
        right={<button onClick={() => setViewState({ ...viewState, checked: {}, quantities: {} })} className="tap px-2 -mr-2 text-sm text-gray-600">Reset</button>}
      />
      <div className="flex-1 overflow-y-auto">
        <div className="px-4 pt-4 pb-2 border-b border-gray-100">
          <div className="text-xl font-bold leading-tight">{autoName(recipe)}</div>
          <div className="text-sm text-gray-500 mt-1 tabular-nums">{done} / {total} ingredients</div>
        </div>

        {sections.map(([role, label]) => grouped[role].length > 0 && (
          <div key={role} className="px-4 pt-5 pb-1">
            <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-1">{label}</div>
            <ul>
              {grouped[role].map(row => {
                const isChecked = !!checked[row.id];
                const isEditing = editingQtyId === row.id;
                return (
                  <li key={row.id} className="flex items-center border-b border-gray-100">
                    <button
                      onClick={() => toggle(row.id)}
                      className="flex-1 flex items-center gap-3 py-3 text-left active:bg-gray-50 min-h-[48px]">
                      <span className={classNames(
                        'w-7 h-7 rounded-full border-2 flex items-center justify-center shrink-0 text-base',
                        isChecked ? 'bg-black border-black text-white' : 'border-gray-400 bg-white'
                      )}>{isChecked ? '✓' : ''}</span>
                      <span className={classNames(
                        'flex-1 text-base leading-snug',
                        isChecked && 'line-through text-gray-400'
                      )}>
                        {rowLabelText(row)}
                      </span>
                    </button>
                    {isEditing ? (
                      <input
                        autoFocus
                        type="number"
                        inputMode="decimal"
                        value={editingQtyVal}
                        onChange={e => setEditingQtyVal(e.target.value)}
                        onBlur={() => saveQty(row)}
                        onKeyDown={e => e.key === 'Enter' && saveQty(row)}
                        className="w-24 text-right px-2 py-3 text-base font-bold tabular-nums border-l border-gray-200 focus:outline-none bg-gray-50"
                      />
                    ) : (
                      <button
                        onClick={() => startEditQty(row)}
                        className={classNames(
                          'tap px-3 text-right text-base font-bold tabular-nums border-l border-gray-100 shrink-0 min-h-[48px] flex items-center',
                          isChecked ? 'line-through text-gray-400' : 'text-black'
                        )}>
                        {rowAmountText(row)}
                      </button>
                    )}
                  </li>
                );
              })}
            </ul>
          </div>
        ))}

        {recipe.notes && (
          <div className="px-4 pt-6 pb-2">
            <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-2">Recipe notes</div>
            <div className="whitespace-pre-wrap text-sm text-gray-800 leading-relaxed">{recipe.notes}</div>
          </div>
        )}

        <div className="px-4 pt-6 pb-4">
          <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-2">Batch notes</div>
          <textarea
            value={viewState.checklistNote || ''}
            onChange={e => setViewState({ ...viewState, checklistNote: e.target.value })}
            placeholder="Add notes for this batch…"
            rows={3}
            className="w-full rounded-xl border border-gray-300 px-3 py-3 text-base resize-none"
          />
        </div>

        <div className="h-24" />
      </div>

      {allChecked && (
        <div className="safe-bottom sticky bottom-0 bg-white border-t border-gray-200 p-3">
          <PrimaryBtn onClick={() => setMakingBatch(true)}>
            Make Batch #{nextBatchNumber}
          </PrimaryBtn>
        </div>
      )}
      {makingBatch && (
        <MakeBatchSheet
          recipe={recipe}
          defaultVolume={liters}
          defaultNote={viewState.checklistNote || ''}
          nextBatchNumber={nextBatchNumber}
          onMake={onMakeBatch}
          onCancel={() => setMakingBatch(false)}
        />
      )}
    </div>
  );
}

function RecipeEditor({ recipe, onSave, onCancel, onDelete }) {
  const [r, setR] = useState(recipe ? { ...recipe, rows: [...recipe.rows] } : {
    id: uuid(),
    custom_name: null,
    notes: '',
    rows: [],
  });
  const [adding, setAdding] = useState(null); // { role: 'surfactant'|'polymer'|'other' }

  const grouped = { surfactant: [], polymer: [], other: [] };
  for (const row of r.rows) (grouped[row.role] || grouped.other).push(row);

  const addRow = (row) => setR({ ...r, rows: [...r.rows, row] });
  const updRow = (row) => setR({ ...r, rows: r.rows.map(x => x.id === row.id ? row : x) });
  const delRow = (id)  => setR({ ...r, rows: r.rows.filter(x => x.id !== id) });

  const previewName = autoName(r);

  const sections = [
    ['polymer', 'Polymers'],
    ['other', 'Base & additives'],
    ['surfactant', 'Surfactants'],
  ];

  return (
    <div className="flex flex-col h-full">
      <Header
        left={<button onClick={onCancel} className="tap px-2 -ml-2 text-base">Cancel</button>}
        title={recipe ? 'Edit recipe' : 'New recipe'}
        right={<button onClick={() => onSave(r)} disabled={r.rows.length === 0}
          className={classNames('tap px-2 -mr-2 text-base font-bold', r.rows.length === 0 ? 'text-gray-400' : '')}>Save</button>}
      />
      <div className="flex-1 overflow-y-auto pb-32">
        <div className="px-4 pt-4">
          <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-1">Recipe name</div>
          <div className="rounded-xl border border-gray-300 bg-gray-50 px-3 py-3 text-base font-semibold">{previewName}</div>
          <div className="text-xs text-gray-500 mt-1">Auto-named from primary surfactant + polymers. Add a custom name if needed:</div>
          <input
            value={r.custom_name || ''}
            onChange={e => setR({ ...r, custom_name: e.target.value || null })}
            placeholder="(optional custom name)"
            className="mt-2 w-full rounded-xl border border-gray-300 px-3 py-3 text-base"
          />
        </div>

        {sections.map(([role, label]) => (
          <div key={role} className="px-4 pt-5">
            <div className="flex items-center justify-between mb-2">
              <div className="text-xs font-bold uppercase tracking-wide text-gray-500">{label}</div>
              <button onClick={() => setAdding({ role })} className="tap px-2 -mr-2 text-sm font-semibold">+ Add</button>
            </div>
            {grouped[role].length === 0 ? (
              <div className="text-sm text-gray-400 py-2">None.</div>
            ) : (
              <ul>
                {grouped[role].map(row => (
                  <li key={row.id}>
                    <RowInline row={row} onChange={updRow} onDelete={() => delRow(row.id)} />
                  </li>
                ))}
              </ul>
            )}
          </div>
        ))}

        <div className="px-4 pt-5">
          <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-2">Notes</div>
          <textarea
            value={r.notes}
            onChange={e => setR({ ...r, notes: e.target.value })}
            rows={6}
            placeholder="Protocol, observations, anything you want to remember…"
            className="w-full rounded-xl border border-gray-300 px-3 py-3 text-base"
          />
        </div>

        {recipe && (
          <div className="px-4 pt-6">
            <button
              onClick={onDelete}
              className="tap w-full rounded-xl px-4 py-3 border border-red-300 text-red-600 font-semibold active:bg-red-50">
              Delete recipe
            </button>
          </div>
        )}
      </div>

      {adding && (
        <AddRowSheet
          role={adding.role}
          onCancel={() => setAdding(null)}
          onAdd={(row) => { addRow(row); setAdding(null); }}
        />
      )}
    </div>
  );
}

function RowInline({ row, onChange, onDelete }) {
  return (
    <div className="flex items-center gap-2 py-2 border-b border-gray-100">
      <input
        value={row.label}
        onChange={e => onChange({ ...row, label: e.target.value })}
        className="flex-1 min-w-0 rounded-lg border border-gray-300 px-3 py-2 text-base"
      />
      <input
        type="number" inputMode="decimal"
        value={row.grams_per_L}
        onChange={e => {
          const v = parseFloat(e.target.value) || 0;
          const patch = { ...row, grams_per_L: v };
          if (row.role === 'polymer') patch.active_g_per_L = v;
          onChange(patch);
        }}
        step="0.01"
        className="w-20 rounded-lg border border-gray-300 px-2 py-2 text-right tabular-nums"
      />
      <span className="text-xs text-gray-500">g/L</span>
      <button onClick={onDelete} className="tap text-red-500 px-2 text-xl leading-none">×</button>
    </div>
  );
}

/* ============================================================
   ADD ROW SHEET
   ============================================================ */

function AddRowSheet({ role, onAdd, onCancel }) {
  const presets = role === 'surfactant' ? SURFACTANTS
    : role === 'polymer' ? POLYMERS
    : COMMON_OTHERS;

  const [picked, setPicked] = useState(null);
  const [customLabel, setCustomLabel] = useState('');
  const [grams, setGrams] = useState('');

  const finalLabel = picked || customLabel.trim();
  const finalShort =
    role === 'surfactant' ? (SURFACTANTS.includes(picked) ? picked : null)
    : role === 'polymer'  ? (POLYMERS.includes(picked) ? picked : null)
    : null;

  const submit = () => {
    if (!finalLabel || !grams) return;
    const v = parseFloat(grams) || 0;
    onAdd({
      id: uuid(),
      role,
      label: finalLabel,
      grams_per_L: v,
      active_g_per_L: role === 'polymer' ? v : null,
      short: finalShort,
    });
  };

  const titleByRole = { surfactant: 'Add surfactant', polymer: 'Add polymer', other: 'Add base / additive' };

  return (
    <div className="fixed inset-0 z-30 flex items-end" onClick={onCancel}>
      <div className="absolute inset-0 bg-black/40" />
      <div className="relative w-full bg-white rounded-t-2xl border-t border-gray-200 sheet-enter safe-bottom max-h-[90vh] overflow-y-auto"
           onClick={e => e.stopPropagation()}>
        <div className="sticky top-0 bg-white border-b border-gray-200 px-4 py-3 flex items-center justify-between">
          <div className="font-semibold text-lg">{titleByRole[role]}</div>
          <button onClick={onCancel} className="tap text-base text-gray-500 px-2">Close</button>
        </div>
        <div className="p-4 space-y-4">
          <div>
            <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-2">Pick one</div>
            <div className="grid grid-cols-2 gap-2">
              {presets.map(p => (
                <button key={p}
                  onClick={() => { setPicked(p); setCustomLabel(''); }}
                  className={classNames(
                    'tap rounded-xl border-2 px-3 py-3 text-base text-left',
                    picked === p ? 'border-black bg-black text-white' : 'border-gray-300 bg-white active:bg-gray-100'
                  )}>
                  {p}
                </button>
              ))}
            </div>
          </div>

          <div>
            <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-2">Or type custom</div>
            <input
              value={customLabel}
              onChange={e => { setCustomLabel(e.target.value); setPicked(null); }}
              placeholder="Custom ingredient name"
              className="w-full rounded-xl border border-gray-300 px-3 py-3 text-base"
            />
          </div>

          <div>
            <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-2">Amount per 1 liter</div>
            <div className="flex items-center gap-2">
              <input
                type="number" inputMode="decimal" autoFocus
                value={grams}
                onChange={e => setGrams(e.target.value)}
                placeholder="e.g. 35"
                className="flex-1 rounded-xl border border-gray-300 px-3 py-3 text-lg tabular-nums"
              />
              <div className="text-base text-gray-700 font-semibold">g / L</div>
            </div>
          </div>

          <div className="flex gap-2 pt-2">
            <SecondaryBtn onClick={onCancel} className="flex-1">Cancel</SecondaryBtn>
            <PrimaryBtn onClick={submit} disabled={!finalLabel || !grams} className="flex-1">Add</PrimaryBtn>
          </div>
        </div>
      </div>
    </div>
  );
}

            <div className="text-xs font-bold uppercase tracking-wide text-gray-500 mb-1">Recipe</div>
